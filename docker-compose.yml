version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://amrutam_user:amrutam_pass@postgres:5432/amrutam_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_amrutam_jwt_key_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: amrutam_user
      POSTGRES_PASSWORD: amrutam_pass
      POSTGRES_DB: amrutam_db
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amrutam_user -d amrutam_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"